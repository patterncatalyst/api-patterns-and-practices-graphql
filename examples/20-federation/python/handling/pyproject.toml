[project]
name = "shipping-python-ch20-handling-subgraph"
version = "1.0.0"
description = "Ch20 Federation - the handling subgraph (Python side, Strawberry federation on FastAPI)."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn==0.54.0",
    "strawberry-graphql==0.335.0",
    "pydantic-settings==2.16.0",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
