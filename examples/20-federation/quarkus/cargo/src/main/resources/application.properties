# Ch20 Federation - Quarkus cargo subgraph.
#
# GraphQL endpoint: POST /graphql on the HTTP port. Container port 8080,
# mapped to host 8302 by compose.yaml. Introspection is on (the default) and
# is what verify.sh reads to compare the live schema with contracts/schema/.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.smallrye-graphql.root-path=/graphql
# Fire the graphql-java GraphQL builder as a CDI event once SmallRye has built
# the federated schema, so ContractSchemaDetails can apply the canonical-SDL
# details (see that class).
quarkus.smallrye-graphql.events.enabled=true

# Two settings come from the environment, through MicroProfile Config's
# standard name mapping (no entry needed here):
#   TRACKING_SOURCE_LATENCY_MS    tracking.source.latency-ms    ms per source call (default 0; compose sets 100)
#   TRACKING_DEBUG_ENDPOINTS      tracking.debug-endpoints      serve /debug/source-calls (default false; lab only)

# Error handling. SmallRye hides the message of every unchecked exception
# unless its class is listed here: an allowlist. SourceUnavailableException and
# BadUserInputException are the two a client may read; anything else answers
# with default-error-message. error-extension-fields keeps `code` as the only
# extension a client gets. print-data-fetcher-exception puts the original
# exception, with its stack, in the server log.
quarkus.smallrye-graphql.show-runtime-exception-message=com.patterncatalyst.shipping.tracking.SourceUnavailableException,com.patterncatalyst.shipping.tracking.BadUserInputException
quarkus.smallrye-graphql.default-error-message=Internal server error.
quarkus.smallrye-graphql.error-extension-fields=code
# Remove SmallRye's built-in providers;
# DeclaredErrorCodeProvider is the only source of extensions.code.
quarkus.class-loading.removed-resources."io.smallrye\:smallrye-graphql"=META-INF/services/io.smallrye.graphql.api.ErrorExtensionProvider
quarkus.smallrye-graphql.print-data-fetcher-exception=true

# Federation 2 subgraph: _service { sdl } and _entities are added to the schema
# because the entity annotations (@Key) are present. Batch resolving hands an
# entity resolver the keys of every representation of its type in one call.
quarkus.smallrye-graphql.federation.enabled=true
quarkus.smallrye-graphql.federation.batch-resolving-enabled=true
