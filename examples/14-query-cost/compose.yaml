# Ch14 Depth limits and query cost analysis - compose topology.
#
# Default `docker compose up` brings up: quarkus, python. Both build their
# schema code-first (SmallRye GraphQL, Strawberry) and serve the same slice of
# the canonical tracking-view SDL (contracts/schema/shipping/*.graphql) as
# Chapter 13: everything except Subscription, with the sources, batching,
# pagination, seed and error contract unchanged. What this chapter adds is a
# set of request limits in front of execution:
#
#   Quarkus  depth 15 (SmallRye instrumentation-query-depth), 5,000 tokens, 20
#            aliases (QueryCost.MaxAliasesInstrumentation) and a cost budget of
#            1,000 (QueryCost + TrackingCostCalculator, on graphql-java's
#            MaxQueryComplexityInstrumentation)
#   Python   14 levels (Strawberry counts a root field as 0), 5,000 tokens,
#            20 aliases and a cost budget of 1,000 (app/limits.py)
#
# Every rejected request makes zero source calls; verify.sh reads the
# /debug/source-calls log to prove it, and diffs each live schema against the
# canonical SDL. The budget is TRACKING_MAX_QUERY_COST on Python and
# tracking.query.max-cost (env TRACKING_QUERY_MAX_COST) on Quarkus.
#
# TRACKING_DEBUG_ENDPOINTS=true turns the /debug/source-calls endpoints on.
# They are a lab tool: leave them off (the default) anywhere else.
#
# Host ports (this chapter): Quarkus 8240, Python 8241, both at /graphql.
# Chapter NN takes 8100 + 10*NN (Quarkus) and +1 (Python), so examples never
# collide with each other or with the Ch0 skeleton on 8080/8081.
#
# Telemetry is off by default (QUARKUS_OTEL_SDK_DISABLED and OTEL_SDK_DISABLED).
# To send traces to the Grafana LGTM stack, add the observability file, which
# adds the lgtm service and switches the SDKs on:
#   docker compose -f compose.yaml -f compose.observability.yaml up --build
#
# Usage:
#   docker compose up --build   # app stack only, telemetry off

# A fixed project name, the same one verify.sh passes with -p: a manual
# `docker compose up` and a verify.sh run share one set of container,
# network and volume names instead of colliding on the container names below.
name: gql-ch14-query-cost

services:
  quarkus:
    build:
      context: ./quarkus
      dockerfile: Containerfile
    container_name: ch14-query-cost-quarkus
    ports:
      - "8240:8080"
    environment:
      - QUARKUS_OTEL_SDK_DISABLED=true
      - TRACKING_SOURCE_LATENCY_MS=250
      - TRACKING_DEBUG_ENDPOINTS=true
    healthcheck:
      # SmallRye Health readiness; curl ships in the UBI runtime image.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  python:
    build:
      context: ./python
      dockerfile: Containerfile
    container_name: ch14-query-cost-python
    ports:
      - "8241:8080"
    environment:
      - OTEL_SDK_DISABLED=true
      - TRACKING_SOURCE_LATENCY_MS=250
      - TRACKING_DEBUG_ENDPOINTS=true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
