# Test configuration. Quarkus loads this file beside the main one, so only the
# differences are listed. SmallRye Config reads every application.properties on
# the classpath, test resources last.

# A free port: tests ask for the address through @TestHTTPResource and
# RestAssured, so they never need to know it.
quarkus.http.test-port=0

# No telemetry export, no source latency and no debug endpoints in a unit of
# the suite: the tests read the source-call log from the SourceCalls bean.
quarkus.otel.sdk.disabled=true
tracking.source.latency-ms=0
tracking.debug-endpoints=false

# Where SchemaExportTest writes the SDL it fetched. The test image sets it to
# the mounted report directory; a local run writes under target/.
tracking.test.export-dir=target
