{{- if .Values.openshift.routes.enabled }}
{{- range $name, $route := .Values.openshift.routes.items }}
---
# {{ $route.description }}
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: {{ $name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "appa.labels" (dict "root" $ "name" $name "component" "route") | nindent 4 }}
  {{- if $route.longLived }}
  annotations:
    # A subscription and an event feed stay open and idle between events.
    haproxy.router.openshift.io/timeout: {{ $.Values.openshift.routes.longLivedTimeout | quote }}
  {{- end }}
spec:
  host: {{ include "appa.host" (dict "root" $ "name" $name) }}
  to:
    kind: Service
    name: {{ $route.service }}
    weight: 100
  port:
    targetPort: {{ $route.port }}
  {{- if $route.tls }}
  tls:
    # The router terminates TLS with the cluster's ingress certificate and
    # forwards plain HTTP to the Service; plain HTTP requests are redirected.
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  {{- end }}
  wildcardPolicy: None
{{- end }}
{{- end }}
