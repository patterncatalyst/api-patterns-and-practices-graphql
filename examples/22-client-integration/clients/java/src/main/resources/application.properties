# Ch22 Client integration - the Java client.
#
# TRACKING_URL (environment) is the GraphQL endpoint to call; compose passes
# the address of a server on the compose network. Both clients read the same
# configuration key, and the header names the client on every request.
quarkus.smallrye-graphql-client.tracking.url=${TRACKING_URL}
quarkus.smallrye-graphql-client.tracking.header.X-Client-Name=ch22-java
quarkus.smallrye-graphql-client.tracking.header.X-Client-Version=1.0.0

# The output of this program is the JSON lines it prints.
quarkus.banner.enabled=false
quarkus.log.level=WARN
