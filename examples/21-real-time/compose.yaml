# Ch21 Real-time - compose topology.
#
# Default `docker compose up` brings up: quarkus, python. Both build their
# schema code-first (SmallRye GraphQL, Strawberry) and serve the whole canonical
# tracking-view SDL (contracts/schema/shipping/*.graphql), Subscription included:
# Subscription.cargoHandled emits each handling event registered for one cargo.
# Both stacks serve it over WebSocket (graphql-transport-ws, and the older
# graphql-ws), Strawberry also over GraphQL-over-SSE (graphql-sse), and both
# serve a plain SSE feed at /events/cargos/{trackingId} that resumes from
# Last-Event-ID. The rest is Chapter 13's tracking view: asynchronous sources, a
# source-call log, DataLoaders on Python and @Source batch resolvers on Quarkus.
#
# TRACKING_DEBUG_ENDPOINTS=true turns the lab endpoints on: /debug/source-calls
# (every call into a source) and /debug/subscribers (live subscriptions per
# channel and tracking id). They are a lab tool: leave them off (the default)
# anywhere else.
#
# The `client` service is the subscription test client (a small Python script on
# gql[websockets]). It sits behind the `client` profile, so `up` leaves it out;
# verify.sh runs it on the compose network with `docker compose run`:
#   docker compose run --rm client --url ws://python:8080/graphql \
#     --tracking-id ABC123 --count 2
#
# Host ports (this chapter): Quarkus 8310, Python 8311. HTTP, WebSocket and SSE
# share the application port, all under /graphql except the SSE feed.
# Chapter NN takes 8100 + 10*NN (Quarkus) and +1 (Python), so examples never
# collide with each other or with the Ch0 skeleton on 8080/8081.
#
# Telemetry is off by default (QUARKUS_OTEL_SDK_DISABLED and OTEL_SDK_DISABLED).
# To send traces to the Grafana LGTM stack, add the observability file, which
# adds the lgtm service and switches the SDKs on:
#   docker compose -f compose.yaml -f compose.observability.yaml up --build
#
# Usage:
#   docker compose up --build   # app stack only, telemetry off

# A fixed project name, the same one verify.sh passes with -p: a manual
# `docker compose up` and a verify.sh run share one set of container,
# network and volume names instead of colliding on the container names below.
name: gql-ch21-real-time

services:
  quarkus:
    build:
      context: ./quarkus
      dockerfile: Containerfile
    container_name: ch21-real-time-quarkus
    ports:
      - "8310:8080"
    environment:
      - QUARKUS_OTEL_SDK_DISABLED=true
      - TRACKING_SOURCE_LATENCY_MS=250
      - TRACKING_DEBUG_ENDPOINTS=true
      # Bound the JVM's memory explicitly so heap + off-heap stay well inside the
      # container cap. The default sizes the heap at 80% of the cgroup and lets
      # direct (Netty/Vert.x) memory grow alongside it; on a slow 2-CPU runner GC
      # lags under subscription load and the total crosses the cap, so the kernel
      # kills the container and compose revives it with a fresh (reseeded) store.
      # These bounds (heap 256m + direct 96m + metaspace 128m + overhead) fit the
      # 768m cap with room to spare for this small app. Keep the image's two opts.
      - JAVA_OPTS_APPEND=-Dquarkus.http.host=0.0.0.0 -Djava.util.logging.manager=org.jboss.logmanager.LogManager -Xms64m -Xmx256m -XX:MaxDirectMemorySize=96m -XX:MaxMetaspaceSize=128m
    deploy:
      resources:
        limits:
          memory: 768m
    healthcheck:
      # SmallRye Health readiness; curl ships in the UBI runtime image.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  python:
    build:
      context: ./python
      dockerfile: Containerfile
    container_name: ch21-real-time-python
    ports:
      - "8311:8080"
    environment:
      - OTEL_SDK_DISABLED=true
      - TRACKING_SOURCE_LATENCY_MS=250
      - TRACKING_DEBUG_ENDPOINTS=true
    # See the quarkus service: a memory cap keeps the heap small so both stacks
    # fit on a small CI runner without the kernel killing one mid-run.
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  # --- Subscription test client (profile `client`) --------------------------
  client:
    build:
      context: ./client
      dockerfile: Containerfile
    profiles: ["client"]
    depends_on:
      quarkus:
        condition: service_healthy
      python:
        condition: service_healthy
