# Ch17 Transport security and introspection control - Quarkus tracking view.
#
# GraphQL endpoint: POST /graphql over HTTPS only. Container port 8443, mapped by
# compose.yaml to host 8270 (public, hardened) and 8272 (internal). One image serves
# both: the public instance sets TRACKING_INTROSPECTION_ENABLED=false in its environment
# (IntrospectionSwitch); the internal one leaves introspection on, and verify.sh reads
# it to compare the live schema with contracts/schema/.
quarkus.http.host=0.0.0.0
quarkus.smallrye-graphql.root-path=/graphql

# TLS. The TLS registry reads a PEM certificate and key that compose mounts at /certs
# (gen-certs.sh writes them; nothing here is committed). The registry's default
# protocol set is TLS 1.3 only (quarkus.tls.protocols), so a TLS 1.2 client fails the
# handshake. insecure-requests=disabled closes the plain-HTTP port.
quarkus.tls.key-store.pem.tls.cert=/certs/tls.crt
quarkus.tls.key-store.pem.tls.key=/certs/tls.key
quarkus.http.ssl-port=8443
quarkus.http.insecure-requests=disabled
quarkus.http.header."Strict-Transport-Security".value=max-age=31536000

# CORS for the one browser origin that may call the API, POST only.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=https://tracking.example.com
quarkus.http.cors.methods=POST
quarkus.http.cors.headers=content-type,authorization

# Size limit: a body over 64K is refused with 413 before it is parsed. GET stays off
# (quarkus.smallrye-graphql.http.get.enabled defaults to false), so a query cannot
# travel in a URL. The parser applies graphql-java's default operation limit of
# 15000 tokens.
quarkus.http.limits.max-body-size=64K
# The schema document at /graphql/schema.graphql is a second introspection path. This
# setting is fixed at build time, so it is off on both instances.
quarkus.smallrye-graphql.schema-available=false

# Fire the schema builder as a CDI event before the schema is built, so
# ContractSchemaDetails can apply the details of the canonical SDL to the
# generated schema (see that class).
quarkus.smallrye-graphql.events.enabled=true

# Three settings come from the environment, through MicroProfile Config's
# standard name mapping (no entry needed here):
#   TRACKING_INTROSPECTION_ENABLED  tracking.introspection.enabled  false on a public instance (default true)
#   TRACKING_SOURCE_LATENCY_MS    tracking.source.latency-ms    ms per source call (default 0; compose sets 250)
#   TRACKING_DEBUG_ENDPOINTS      tracking.debug-endpoints      serve /debug/source-calls (default false; lab only)

# OTLP endpoint for the opt-in `observability` compose profile. Exports fail
# soft (logged, non-fatal) when no collector is listening.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=ch17-transport-quarkus

# Error handling. SmallRye hides the message of every unchecked exception
# unless its class is listed here: an allowlist. SourceUnavailableException and
# BadUserInputException are the two a client may read; anything else answers
# with default-error-message. error-extension-fields keeps `code` as the only
# extension a client gets. print-data-fetcher-exception puts the original
# exception, with its stack, in the server log.
quarkus.smallrye-graphql.show-runtime-exception-message=com.patterncatalyst.shipping.tracking.SourceUnavailableException,com.patterncatalyst.shipping.tracking.BadUserInputException
quarkus.smallrye-graphql.default-error-message=Internal server error.
quarkus.smallrye-graphql.error-extension-fields=code
# Remove SmallRye's built-in providers;
# DeclaredErrorCodeProvider is the only source of extensions.code.
quarkus.class-loading.removed-resources."io.smallrye\:smallrye-graphql"=META-INF/services/io.smallrye.graphql.api.ErrorExtensionProvider
quarkus.smallrye-graphql.print-data-fetcher-exception=true
