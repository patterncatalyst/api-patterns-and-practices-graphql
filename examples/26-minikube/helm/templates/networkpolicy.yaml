{{- if .Values.networkPolicy.enabled }}
# A tier accepts traffic from the tier in front of it and from nothing else.
# Probes come from the kubelet on the node and are not subject to these rules.
---
# The stacks accept the edge and the helm test pod.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gql.labels" (dict "root" . "name" "backend" "component" "backend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [edge, test]
      ports:
        - protocol: TCP
          port: 8080
---
# The edge is the way in from outside the cluster: any source, its own ports.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: edge
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gql.labels" (dict "root" . "name" "edge" "component" "edge") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: edge
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: {{ include "gql.edgePort" (dict "root" . "stack" "quarkus") }}
        - protocol: TCP
          port: {{ include "gql.edgePort" (dict "root" . "stack" "python") }}
{{- if .Values.lgtm.enabled }}
---
# OTLP from the pods of the release; the UIs and query APIs from any source.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: lgtm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gql.labels" (dict "root" . "name" "lgtm" "component" "observability") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: observability
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/instance: {{ .Release.Name }}
      ports:
        - protocol: TCP
          port: 4317
        - protocol: TCP
          port: 4318
    - ports:
        - protocol: TCP
          port: 3000
        - protocol: TCP
          port: 3200
        - protocol: TCP
          port: 9090
        - protocol: TCP
          port: 3100
{{- end }}
{{- end }}
