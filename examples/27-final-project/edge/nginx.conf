# Ch27 The final project - the edge in front of the public instances.
#
# Two TLS listeners, one per stack, so the chapter port rule holds:
#   8443  ->  http://quarkus:8080   (host 8370)
#   8444  ->  http://python:8080    (host 8371)
#
# What the edge decides, so the backends do not have to (Chapter 25's edge, plus
# the paths of Chapter 21):
#   - TLS 1.3 only; the certificate and key are compose secrets under /run/secrets.
#   - A request body over 64k is refused with 413 before it reaches a backend.
#   - Only /graphql (queries, mutations and the WebSocket upgrade of a
#     subscription) and /events/ (the server-sent event feed) are routed; every
#     other path answers 404 here.
#   - Authorization, traceparent and tracestate pass through unchanged: the
#     backends validate the token, and the trace a client starts continues in
#     the backend. The access log records the traceparent.
#
# The image runs as uid 1001, so the pid file and every temporary path are under /tmp.

worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format edge '$remote_addr "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr trace=$http_traceparent';
    access_log /dev/stdout edge;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    ssl_protocols       TLSv1.3;
    ssl_certificate     /run/secrets/edge_tls_crt;
    ssl_certificate_key /run/secrets/edge_tls_key;

    client_max_body_size 64k;

    # A WebSocket upgrade passes through when the client asks for one.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;

    # Docker's embedded DNS. The backends are looked up per request, so an edge keeps
    # working when a backend restarts and comes back at another address.
    resolver 127.0.0.11 valid=10s;

    # A subscription and an event feed are connections that stay open and idle between events.
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    server {
        listen 8443 ssl;
        server_name localhost;

        set $backend http://quarkus:8080;

        location = /graphql {
            proxy_pass $backend;
        }
        location /events/ {
            proxy_pass $backend;
            proxy_buffering off;
        }
        location / {
            return 404;
        }
    }

    server {
        listen 8444 ssl;
        server_name localhost;

        set $backend http://python:8080;

        location = /graphql {
            proxy_pass $backend;
        }
        location /events/ {
            proxy_pass $backend;
            proxy_buffering off;
        }
        location / {
            return 404;
        }
    }
}
