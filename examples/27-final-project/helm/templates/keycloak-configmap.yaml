apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gql.labels" (dict "root" . "name" "keycloak" "component" "identity") | nindent 4 }}
data:
