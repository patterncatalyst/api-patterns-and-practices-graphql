# The bootstrap administrator of the development server (a lab credential).
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gql.labels" (dict "root" . "name" "keycloak" "component" "identity") | nindent 4 }}
type: Opaque
stringData:
  username: {{ .Values.keycloak.adminUsername | quote }}
  password: {{ .Values.keycloak.adminPassword | quote }}
