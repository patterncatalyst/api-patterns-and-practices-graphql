{{- if .Values.edge.tls.enabled }}
{{- /*
The edge certificate is generated by the chart: a throwaway CA and one server
certificate signed by it. lookup reads the Secret from the cluster, so an
upgrade keeps the certificate that is already there; a template-only render
(helm template, CI) has no cluster to read and generates a fresh one.
*/ -}}
{{- $name := include "gql.tlsSecretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $ca := "" }}
{{- $crt := "" }}
{{- $key := "" }}
{{- if and $existing $existing.data }}
{{- $ca = index $existing.data "ca.crt" }}
{{- $crt = index $existing.data "tls.crt" }}
{{- $key = index $existing.data "tls.key" }}
{{- else }}
{{- $dns := list }}
{{- $ips := list }}
{{- range .Values.edge.tls.sans }}
{{- if regexMatch "^[0-9.]+$" . }}{{ $ips = append $ips . }}{{ else }}{{ $dns = append $dns . }}{{ end }}
{{- end }}
{{- $dns = concat $dns (list (printf "edge.%s" .Release.Namespace) (printf "edge.%s.svc" .Release.Namespace) (printf "edge.%s.svc.cluster.local" .Release.Namespace)) }}
{{- $genCa := genCA "gql-ch27 lab CA" (int .Values.edge.tls.validityDays) }}
{{- $cert := genSignedCert "localhost" $ips $dns (int .Values.edge.tls.validityDays) $genCa }}
{{- $ca = b64enc $genCa.Cert }}
{{- $crt = b64enc $cert.Cert }}
{{- $key = b64enc $cert.Key }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "gql.labels" (dict "root" . "name" "edge" "component" "edge") | nindent 4 }}
type: kubernetes.io/tls
data:
  ca.crt: {{ $ca }}
  tls.crt: {{ $crt }}
  tls.key: {{ $key }}
{{- end }}
