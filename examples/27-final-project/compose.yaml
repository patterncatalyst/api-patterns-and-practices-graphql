# Ch27 The final project - the complete tracking view behind one edge.
#
# `docker compose up` brings up, in this order by health: lgtm and keycloak, the
# four application instances, then the edge. Both stacks build their schema
# CODE-FIRST (SmallRye GraphQL, Strawberry) and serve the whole canonical
# tracking-view SDL (contracts/schema/shipping/*.graphql), Subscription included.
# Each stack is one image run twice:
#
#   quarkus, python
#            The public instances. Introspection is off. They join the internal
#            `backend` network only and publish nothing; the edge is their only
#            way in.
#   quarkus-internal, python-internal
#            The same images with introspection on, for the contract check and
#            for a developer. They join `backend` and `ops` and publish on
#            127.0.0.1 only.
#   edge     nginx on ubi10/nginx-126. TLS 1.3, a 64k body limit, and only
#            /graphql (queries, mutations, WebSocket upgrades) and /events/
#            (server-sent events) routed. Its configuration is a compose config
#            and its certificate and key are compose secrets.
#   keycloak The identity provider: `start-dev --import-realm` loads
#            keycloak/shipping-realm.json (realm `shipping`, users ana, bo and
#            ops, clients tracking-cli, other-cli and short-cli).
#   lgtm     The observability backend. Its UIs and query APIs are published on
#            127.0.0.1 only.
#   client   (profile `client`) the subscription test client.
#   load     (profile `load`) the k6 runner. Both run on the backend network and
#            reach the edge by name.
#
# Networks:
#   public   the edge's published listeners
#   ops      the internal instances, keycloak and the lgtm UIs
#   backend  internal: no route to or from the host
#
# Host ports (this chapter): chapter NN takes 8100 + 10*NN, so 8370 up.
#   8370  edge:8443  HTTPS  /graphql and /events/ of quarkus
#   8371  edge:8444  HTTPS  /graphql and /events/ of python
#   127.0.0.1:8372  quarkus-internal  (HTTP, introspection on)
#   127.0.0.1:8373  python-internal   (HTTP, introspection on)
#   127.0.0.1:8374  Keycloak          (tokens are fetched here; it is the issuer)
#   127.0.0.1:8375  Grafana       (lgtm :3000)
#   127.0.0.1:8376  Tempo API     (lgtm :3200)
#   127.0.0.1:8377  Prometheus    (lgtm :9090)
#   127.0.0.1:8378  Loki          (lgtm :3100)
#
# The users, passwords and the Keycloak admin login are test fixtures for this
# lab. sslRequired is none and the password grant is on for the same reason;
# production uses TLS and the authorization code flow with PKCE.
# TRACKING_DEBUG_ENDPOINTS=true turns the lab endpoints on (the edge does not
# route them); leave them off anywhere else.
#
# Usage:
#   examples/27-final-project/gen-certs.sh certs        # a throwaway CA and edge certificate
#   docker compose up --build
#
# CERT_DIR names the directory that holds ca.crt, edge.crt and edge.key (default ./certs).

# A fixed project name, the same one verify.sh passes with -p.
name: gql-ch27-final

x-app: &app
  restart: unless-stopped
  stop_grace_period: 15s
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

x-quarkus-build: &quarkus-build
  context: ./quarkus
  dockerfile: Containerfile

x-python-build: &python-build
  context: ./python
  dockerfile: Containerfile

x-quarkus: &quarkus
  <<: *app
  build: *quarkus-build
  image: gql-ch27-quarkus:1.0
  env_file: ./env/quarkus.env
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 896m
  depends_on:
    lgtm:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  healthcheck:
    # SmallRye Health readiness; curl ships in the UBI runtime image.
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/q/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 20s

x-python: &python
  <<: *app
  build: *python-build
  image: gql-ch27-python:1.0
  env_file: ./env/python.env
  deploy:
    resources:
      limits:
        cpus: "0.5"
        memory: 384m
  depends_on:
    lgtm:
      condition: service_healthy
    keycloak:
      condition: service_healthy
  healthcheck:
    test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health/ready"]
    interval: 5s
    timeout: 3s
    retries: 20
    start_period: 10s

services:
  # --- the public instances: introspection off, reachable only through the edge ---
  quarkus:
    <<: *quarkus
    container_name: ch27-final-quarkus
    networks: [backend]
    environment:
      - TRACKING_SOURCE_LATENCY_MS=${TRACKING_SOURCE_LATENCY_MS:-250}
      - TRACKING_DEBUG_ENDPOINTS=true # lab: the edge does not route /debug
      - TRACKING_INTROSPECTION_ENABLED=false

  python:
    <<: *python
    container_name: ch27-final-python
    networks: [backend]
    environment:
      - TRACKING_SOURCE_LATENCY_MS=${TRACKING_SOURCE_LATENCY_MS:-250}
      - TRACKING_DEBUG_ENDPOINTS=true # lab: the edge does not route /debug
      - TRACKING_PUBLIC=true

  # --- the internal instances: the same images, introspection on, loopback only ---
  quarkus-internal:
    <<: *quarkus
    container_name: ch27-final-quarkus-internal
    networks: [backend, ops]
    ports:
      - "127.0.0.1:8372:8080"
    environment:
      - QUARKUS_OTEL_SERVICE_NAME=ch27-final-quarkus-internal
      - TRACKING_SOURCE_LATENCY_MS=${TRACKING_SOURCE_LATENCY_MS:-250}
      - TRACKING_DEBUG_ENDPOINTS=true

  python-internal:
    <<: *python
    container_name: ch27-final-python-internal
    networks: [backend, ops]
    ports:
      - "127.0.0.1:8373:8080"
    environment:
      - OTEL_SERVICE_NAME=ch27-final-python-internal
      - TRACKING_SOURCE_LATENCY_MS=${TRACKING_SOURCE_LATENCY_MS:-250}
      - TRACKING_DEBUG_ENDPOINTS=true

  edge:
    <<: *app
    image: registry.access.redhat.com/ubi10/nginx-126:10.2-1791973310
    container_name: ch27-final-edge
    command: ["nginx", "-g", "daemon off;"]
    configs:
      - source: edge_conf
        target: /etc/nginx/nginx.conf
    secrets:
      - edge_tls_crt
      - edge_tls_key
    networks:
      - public
      - backend
    ports:
      - "8370:8443" # nginx -> quarkus
      - "8371:8444" # nginx -> python
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m
    depends_on:
      quarkus:
        condition: service_healthy
      python:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - --cacert
        - /run/secrets/edge_tls_crt
        - -H
        - "Content-Type: application/json"
        - -d
        - '{"query":"{ __typename }"}'
        - https://localhost:8443/graphql
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # The identity provider (Chapter 18). Readiness is on the management port
  # (9000), which is not published.
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: ch27-final-keycloak
    restart: unless-stopped
    # Cap the JVM: without a limit Keycloak sizes its heap from the whole host, so
    # on a small CI runner this stack (four app JVMs plus Keycloak and the LGTM
    # backend) can exhaust memory and the kernel kills a container mid-run.
    deploy:
      resources:
        limits:
          memory: 1024m
    command: ["start-dev", "--import-realm"]
    networks:
      - backend
      - ops
    ports:
      - "127.0.0.1:8374:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin-fixture-pw
      - KC_HEALTH_ENABLED=true
    volumes:
      - ./keycloak/shipping-realm.json:/opt/keycloak/data/import/shipping-realm.json:ro,z
    healthcheck:
      # The image has bash but no curl, so the probe is a bash /dev/tcp request.
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # The observability backend: OpenTelemetry Collector (OTLP in), Tempo
  # (traces, with the span-metrics generator), Prometheus (metrics), Loki
  # (logs) and Grafana, preconfigured with all three data sources.
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.37.0
    container_name: ch27-final-lgtm
    restart: unless-stopped
    # Cap the all-in-one observability backend so the stack fits a small CI runner.
    deploy:
      resources:
        limits:
          memory: 2g
    networks:
      - backend
      - ops
    ports:
      - "127.0.0.1:8375:3000" # Grafana UI
      - "127.0.0.1:8376:3200" # Tempo API
      - "127.0.0.1:8377:9090" # Prometheus query API
      - "127.0.0.1:8378:3100" # Loki query API
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    healthcheck:
      # curl ships in the image. Ready means Grafana, Tempo and Loki all answer.
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://localhost:3000/api/health && curl -fsS -o /dev/null http://localhost:3200/ready && curl -fsS -o /dev/null http://localhost:3100/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

  # --- Subscription test client (profile `client`) ---------------------------
  client:
    build:
      context: ./client
      dockerfile: Containerfile
    image: gql-ch27-client:1.0
    profiles: ["client"]
    networks: [backend]
    environment:
      - SSL_CERT_FILE=/certs/ca.crt
    configs:
      - source: ca_crt
        target: /certs/ca.crt
    depends_on:
      edge:
        condition: service_healthy

  # --- k6 load runner (profile `load`) ----------------------------------------
  # TARGET, STACK, RUN and TOKEN come from the caller (`docker compose run -e ...`).
  load:
    build:
      context: ./load
      dockerfile: Containerfile
      additional_contexts:
        documents: ./documents
    image: gql-ch27-load:1.0
    profiles: ["load"]
    networks: [backend]
    environment:
      - SSL_CERT_FILE=/certs/ca.crt
    configs:
      - source: ca_crt
        target: /certs/ca.crt
    command: ["run", "--quiet", "/scripts/tracking.js"]
    depends_on:
      edge:
        condition: service_healthy

networks:
  public: {}
  ops: {}
  backend:
    internal: true

configs:
  edge_conf:
    file: ./edge/nginx.conf
  ca_crt:
    file: ${CERT_DIR:-./certs}/ca.crt

secrets:
  edge_tls_crt:
    file: ${CERT_DIR:-./certs}/edge.crt
  edge_tls_key:
    file: ${CERT_DIR:-./certs}/edge.key
