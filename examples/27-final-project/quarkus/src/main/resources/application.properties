# Ch27 The final project - Quarkus tracking view.
#
# Subscription.cargoHandled is served on the same path over WebSocket
# (graphql-transport-ws and graphql-ws, SmallRye's default subprotocols); the
# plain SSE feed is a REST resource at /events/cargos/{trackingId}.
# GraphQL endpoint: POST /graphql on the HTTP port. Container port 8080, on the
# backend network of compose.yaml; the edge publishes it as host 8370 over TLS.
# Introspection is on (the default) and is what verify.sh reads to compare the
# live schema with contracts/schema/.
quarkus.http.host=0.0.0.0
quarkus.http.port=8080
quarkus.smallrye-graphql.root-path=/graphql
# Fire the schema builder as a CDI event before the schema is built, so
# ContractSchemaDetails can apply the details of the canonical SDL to the
# generated schema (see that class).
quarkus.smallrye-graphql.events.enabled=true

# Settings that come from the environment, through MicroProfile Config's
# standard name mapping (no entry needed here):
#   TRACKING_SOURCE_LATENCY_MS    tracking.source.latency-ms    ms per source call (default 0; compose sets 250)
#   TRACKING_DEBUG_ENDPOINTS      tracking.debug-endpoints      serve /debug/source-calls (default false; lab only)
#   TRACKING_INTROSPECTION_ENABLED tracking.introspection.enabled false on a public instance (default true)
#   TRACKING_QUERY_MAX_COST       tracking.query.max-cost       the cost budget (default 1000)

# OpenTelemetry. Traces, metrics and logs leave over OTLP to the collector in
# the lgtm service (compose sets OTEL_EXPORTER_OTLP_ENDPOINT). Metrics and logs
# are off by default in the extension and switched on here. The short export
# intervals keep the lab responsive; a service in production keeps the defaults.
quarkus.otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4317}
quarkus.otel.service.name=ch27-final-quarkus
quarkus.otel.metrics.enabled=true
quarkus.otel.logs.enabled=true
quarkus.otel.metric.export.interval=5s
quarkus.otel.bsp.schedule.delay=1s
# The operation span and the span per resolver come from the OpenTelemetry
# graphql-java instrumentation (Telemetry.java), so SmallRye's own operation
# span is off and each request has exactly one.
quarkus.smallrye-graphql.tracing.enabled=false

# Error handling. SmallRye hides the message of every unchecked exception
# unless its class is listed here: an allowlist. SourceUnavailableException and
# BadUserInputException are the two a client may read; anything else answers
# with default-error-message. error-extension-fields names the extensions
# written on a resolver's error: `code` and `traceId`. print-data-fetcher-exception puts the original
# exception, with its stack, in the server log.
quarkus.smallrye-graphql.show-runtime-exception-message=com.patterncatalyst.shipping.tracking.SourceUnavailableException,com.patterncatalyst.shipping.tracking.BadUserInputException,com.patterncatalyst.shipping.tracking.AuthenticationRequiredException,com.patterncatalyst.shipping.tracking.OperatorRoleRequiredException,com.patterncatalyst.shipping.tracking.WatchNotPermittedException
quarkus.smallrye-graphql.default-error-message=Internal server error.
quarkus.smallrye-graphql.error-extension-fields=code,traceId
# Remove SmallRye's built-in providers;
# DeclaredErrorCodeProvider is the only source of extensions.code.
quarkus.class-loading.removed-resources."io.smallrye\:smallrye-graphql"=META-INF/services/io.smallrye.graphql.api.ErrorExtensionProvider
quarkus.smallrye-graphql.print-data-fetcher-exception=true

# Debugging.
# The trace id of the request reaches the client as extensions.traceId
# (TraceIdExtensionProvider, listed beside DeclaredErrorCodeProvider in the
# ServiceLoader file). The console format carries it too, so a log line can be
# matched to a response by that id.
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p traceId=%X{traceId} [%c{3.}] %s%e%n
# The application's debug category (ResolveLog) is INFO; raise it with
# QUARKUS_LOG_CATEGORY__COM_PATTERNCATALYST_SHIPPING_TRACKING_RESOLVE__LEVEL=DEBUG.
quarkus.log.category."com.patterncatalyst.shipping.tracking.resolve".level=INFO

# Shutdown. On SIGTERM the HTTP server stops accepting requests and waits up to
# this long for the ones in flight; the compose stop_grace_period is longer.
quarkus.shutdown.timeout=10s

# Request limits (Chapter 14). The depth limit is SmallRye's own setting and fires in the
# engine; the cost budget, the alias limit (the same 20 as Strawberry's
# MaxAliasesLimiter) and the operation token limit are QueryCost, which appends
# to the same chain. instrumentation-query-complexity stays unset: it counts
# every field as 1. QueryCost sets the operation token limit through graphql-java's ParserOptions.
quarkus.smallrye-graphql.instrumentation-query-depth=15
tracking.query.max-cost=1000
tracking.query.max-tokens=5000
tracking.query.max-aliases=20

# Authentication (Chapter 18): Quarkus OIDC in bearer-token (service) mode. The app reads the
# signing keys from the identity provider over the backend network (the back
# channel, discovery off), but the tokens carry the address clients use, so the
# issuer is pinned to that address. The pin is configuration, so the same image
# runs in every tier: QUARKUS_OIDC_TOKEN_ISSUER and QUARKUS_OIDC_AUTH_SERVER_URL
# override these values. A token for another audience, with another issuer,
# expired or tampered with is answered with 401 and WWW-Authenticate before
# GraphQL runs. There is no auth.permission entry for /graphql: a request with
# no token is anonymous and the public fields still work.
quarkus.oidc.application-type=service
quarkus.oidc.auth-server-url=http://keycloak:8080/realms/shipping
quarkus.oidc.discovery-enabled=false
quarkus.oidc.jwks-path=protocol/openid-connect/certs
quarkus.oidc.token.issuer=http://localhost:8374/realms/shipping
quarkus.oidc.token.audience=tracking-api
quarkus.oidc.roles.role-claim-path=realm_access/roles
quarkus.oidc.devservices.enabled=false

# Introspection (Chapter 17). One image serves both kinds of instance: a public
# instance sets TRACKING_INTROSPECTION_ENABLED=false in its environment
# (IntrospectionSwitch); an internal one leaves introspection on, and verify.sh
# reads it there to compare the live schema with contracts/schema/. The schema
# document at /graphql/schema.graphql is a second introspection path; the
# setting is fixed at build time, so it is off on both kinds.
quarkus.smallrye-graphql.schema-available=false
