[project]
name = "shipping-python-ch27-final"
version = "1.0.0"
description = "Ch27 The final project - the complete tracking view (Python side, Strawberry on FastAPI)."
requires-python = ">=3.14"
dependencies = [
    "fastapi==0.143.2",
    "uvicorn[standard]==0.54.0",
    "strawberry-graphql==0.335.0",
    "pydantic-settings==2.16.0",
    "python-multipart==0.0.32",
    "pyjwt[crypto]==2.15.1",
    "opentelemetry-api==1.45.1",
    "opentelemetry-distro==0.66b1",
    "opentelemetry-exporter-otlp-proto-grpc==1.45.1",
    "opentelemetry-instrumentation-fastapi==0.66b1",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
