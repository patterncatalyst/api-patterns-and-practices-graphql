# Ch25 Local with Docker Compose - the tracking view as one local tier.
#
# `docker compose up` brings up, in this order by health: lgtm, quarkus and
# python, then the edge. Both stacks build their schema CODE-FIRST (SmallRye
# GraphQL, Strawberry) and serve the same slice of the canonical tracking-view
# SDL (contracts/schema/shipping/*.graphql) as Chapters 19 and 24: everything
# except Subscription. What this chapter adds is the tier around them:
#
#   edge     nginx on ubi10/nginx-126. TLS 1.3, a 64k body limit, only /graphql
#            routed. Its configuration is a compose config and its certificate
#            and key are compose secrets.
#   quarkus, python
#            The two stacks, built once into gql-ch25-quarkus:1.0 and
#            gql-ch25-python:1.0 (the images Chapter 26 loads into a cluster).
#            They join the internal `backend` network only and publish nothing.
#   lgtm     The observability backend. Its UIs and query APIs are published on
#            127.0.0.1 only.
#
# Networks:
#   public   the edge's published listeners
#   ops      the lgtm UIs and query APIs
#   backend  internal: no route to or from the host; edge, quarkus, python, lgtm
#
# Host ports (this chapter): chapter NN takes 8100 + 10*NN, so 8350 up.
#   8350  edge:8443  HTTPS  /graphql of quarkus
#   8351  edge:8444  HTTPS  /graphql of python
#   127.0.0.1:8352  Grafana       (lgtm :3000)
#   127.0.0.1:8353  Tempo API     (lgtm :3200)
#   127.0.0.1:8354  Prometheus    (lgtm :9090)
#   127.0.0.1:8355  Loki          (lgtm :3100)
# The collector's OTLP ports (4317 gRPC, 4318 HTTP) stay on the backend network.
#
# Usage:
#   examples/25-docker-compose/gen-certs.sh certs        # a throwaway CA and edge certificate
#   docker compose up --build
#   open http://localhost:8352                           # Grafana, anonymous Admin (lab only)
#
# CERT_DIR names the directory that holds edge.crt and edge.key (default ./certs).

# A fixed project name, the same one verify.sh passes with -p.
name: gql-ch25-compose

x-app: &app
  restart: unless-stopped
  stop_grace_period: 15s
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"
  networks:
    - backend

services:
  quarkus:
    <<: *app
    build:
      context: ./quarkus
      dockerfile: Containerfile
    image: gql-ch25-quarkus:1.0
    container_name: ch25-compose-quarkus
    env_file: ./env/quarkus.env
    environment:
      - TRACKING_SOURCE_LATENCY_MS=${TRACKING_SOURCE_LATENCY_MS:-250}
      - TRACKING_DEBUG_ENDPOINTS=true # lab: the edge does not route /debug
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768m
    depends_on:
      lgtm:
        condition: service_healthy
    healthcheck:
      # SmallRye Health readiness; curl ships in the UBI runtime image.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/q/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  python:
    <<: *app
    build:
      context: ./python
      dockerfile: Containerfile
    image: gql-ch25-python:1.0
    container_name: ch25-compose-python
    env_file: ./env/python.env
    environment:
      - TRACKING_SOURCE_LATENCY_MS=${TRACKING_SOURCE_LATENCY_MS:-250}
      - TRACKING_DEBUG_ENDPOINTS=true # lab: the edge does not route /debug
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384m
    depends_on:
      lgtm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  edge:
    <<: *app
    image: registry.access.redhat.com/ubi10/nginx-126:10.2-1791973310
    container_name: ch25-compose-edge
    command: ["nginx", "-g", "daemon off;"]
    configs:
      - source: edge_conf
        target: /etc/nginx/nginx.conf
    secrets:
      - edge_tls_crt
      - edge_tls_key
    networks:
      - public
      - backend
    ports:
      - "8350:8443" # nginx -> quarkus
      - "8351:8444" # nginx -> python
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64m
    depends_on:
      quarkus:
        condition: service_healthy
      python:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - -o
        - /dev/null
        - --cacert
        - /run/secrets/edge_tls_crt
        - -H
        - "Content-Type: application/json"
        - -d
        - '{"query":"{ __typename }"}'
        - https://localhost:8443/graphql
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  # The observability backend: OpenTelemetry Collector (OTLP in), Tempo
  # (traces, with the span-metrics generator), Prometheus (metrics), Loki
  # (logs) and Grafana, preconfigured with all three data sources.
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.37.0
    container_name: ch25-compose-lgtm
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2g
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - backend
      - ops
    ports:
      - "127.0.0.1:8352:3000" # Grafana UI
      - "127.0.0.1:8353:3200" # Tempo API
      - "127.0.0.1:8354:9090" # Prometheus query API
      - "127.0.0.1:8355:3100" # Loki query API
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    healthcheck:
      # curl ships in the image. Ready means Grafana, Tempo and Loki all answer.
      test:
        - CMD-SHELL
        - curl -fsS -o /dev/null http://localhost:3000/api/health && curl -fsS -o /dev/null http://localhost:3200/ready && curl -fsS -o /dev/null http://localhost:3100/ready
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s

networks:
  public: {}
  ops: {}
  backend:
    internal: true

configs:
  edge_conf:
    file: ./edge/nginx.conf

secrets:
  edge_tls_crt:
    file: ${CERT_DIR:-./certs}/edge.crt
  edge_tls_key:
    file: ${CERT_DIR:-./certs}/edge.key
