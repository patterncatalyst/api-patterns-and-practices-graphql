# Ch25 Local with Docker Compose - the edge in front of both stacks.
#
# Two TLS listeners, one per stack, so the chapter port rule holds:
#   8443  ->  http://quarkus:8080   (host 8350)
#   8444  ->  http://python:8080    (host 8351)
#
# What the edge decides, so the backends do not have to:
#   - TLS 1.3 only; the certificate and key are compose secrets under /run/secrets.
#   - A request body over 64k is refused with 413 before it reaches a backend.
#   - Only /graphql is routed; every other path answers 404 here.
#   - traceparent and tracestate pass through unchanged, so the trace a client
#     starts continues in the backend. The access log records the traceparent.
#
# The image runs as uid 1001, so the pid file and every temporary path are under /tmp.

worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    log_format edge '$remote_addr "$request" $status $body_bytes_sent '
                    'upstream=$upstream_addr trace=$http_traceparent';
    access_log /dev/stdout edge;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    # Each backend is resolved through the network's DNS (Docker's resolver),
    # so a restarted container is found at its new address.
    resolver 127.0.0.11 valid=10s;

    ssl_protocols       TLSv1.3;
    ssl_certificate     /run/secrets/edge_tls_crt;
    ssl_certificate_key /run/secrets/edge_tls_key;

    client_max_body_size 64k;

    # A WebSocket upgrade passes through when the client asks for one.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    proxy_http_version 1.1;
    proxy_set_header   Host              $host;
    proxy_set_header   X-Forwarded-For   $remote_addr;
    proxy_set_header   X-Forwarded-Proto https;
    proxy_set_header   Upgrade           $http_upgrade;
    proxy_set_header   Connection        $connection_upgrade;

    server {
        listen 8443 ssl;
        server_name localhost;

        location = /graphql {
            set $backend http://quarkus:8080;
            proxy_pass $backend;
        }
        location / {
            return 404;
        }
    }

    server {
        listen 8444 ssl;
        server_name localhost;

        location = /graphql {
            set $backend http://python:8080;
            proxy_pass $backend;
        }
        location / {
            return 404;
        }
    }
}
