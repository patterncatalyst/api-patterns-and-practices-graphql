# Ch16 Caching - the HTTP cache in front of each stack.
#
# Two listeners, one cache:
#   8080  ->  http://quarkus:8080   (host 8262)
#   8081  ->  http://python:8080    (host 8263)
#
# nginx stores a response only when the server says it may: proxy_cache honours the
# upstream Cache-Control (max-age stores it, no-store and private do not), and no
# proxy_cache_valid is set, so nothing is cached on nginx's own say-so. Only GET and
# HEAD are cached. A request with an Authorization header neither reads from nor
# writes to the cache, and the response says BYPASS.
#
# The image runs as uid 1001, so every path nginx writes is under /tmp.
# A client that sends a hash-only GET must send "Accept: application/json":
# Strawberry serves its IDE page when Accept includes text/html or */*. nginx forwards
# the header unchanged. Every public response carries Vary: Accept, and proxy_cache
# stores one entry per Accept value.

worker_processes 1;
error_log /dev/stderr notice;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}

http {
    access_log /dev/stdout;

    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;
    uwsgi_temp_path       /tmp/nginx-uwsgi;
    scgi_temp_path        /tmp/nginx-scgi;

    proxy_cache_path /tmp/nginx-cache keys_zone=graphql:10m max_size=50m inactive=10m;

    # The key is the whole URL: for a persisted GET that is the endpoint, the
    # hash, the variables and the operation name, and nothing about the caller.
    # That is why Authorization bypasses the cache instead of joining the key.
    # Both listeners serve the same paths for different origins and $host
    # carries no port, so the upstream ($proxy_host) is part of the key;
    # without it the Python answer would be served for the Quarkus URL.
    proxy_cache         graphql;
    proxy_cache_methods GET HEAD;
    proxy_cache_key     "$scheme$request_method$proxy_host$request_uri";
    proxy_no_cache      $http_authorization;
    proxy_cache_bypass  $http_authorization;

    proxy_http_version 1.1;
    proxy_set_header   Host $host;
    add_header         X-Cache-Status $upstream_cache_status always;

    server {
        listen 8080;
        location / {
            proxy_pass http://quarkus:8080;
        }
    }

    server {
        listen 8081;
        location / {
            proxy_pass http://python:8080;
        }
    }
}
