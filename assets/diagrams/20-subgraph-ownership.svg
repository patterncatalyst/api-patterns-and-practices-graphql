<text x="500.0" y="115.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">the same entity, the same key</text>
<text x="500.0" y="115.0" font-size="11" fill="#b8650a" text-anchor="middle">the same entity, the same key</text>
<path d="M660,295 L340,225" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="540.0" y="250.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">reference</text>
<text x="540.0" y="250.0" font-size="11" fill="#555" text-anchor="middle">reference</text>
<path d="M660,365 L340,300" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="540.0" y="346.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">reference</text>
<text x="540.0" y="346.5" font-size="11" fill="#555" text-anchor="middle">reference</text>
<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Each field has one owner; an entity is shared by its key, a reference names a place and nothing else</text>
<text x="40" y="585" font-size="12" fill="#555555" text-anchor="start">A reference carries only the key. The handling subgraph can say where an event happened; the name of the place is the cargo subgraph&#x27;s to resolve.</text>
</svg>