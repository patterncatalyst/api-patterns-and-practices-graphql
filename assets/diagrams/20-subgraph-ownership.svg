<rect x="660" y="396" width="300" height="46" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="810.0" y="417.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Mutation.registerHandlingEvent</text>
<text x="810.0" y="434.0" font-size="11.5" fill="#555555" text-anchor="middle">Delivery, HandlingActivity, UserError</text>
