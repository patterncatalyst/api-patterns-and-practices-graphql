<rect x="670" y="490" width="290" height="60" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5"/>
<text x="815.0" y="518.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">RoutingStatus</text>
