<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="50" width="1060" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#1d1d1d">GET 1: nothing stored yet</text>
<rect x="20" y="240" width="1060" height="170" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="260" font-size="12" font-weight="700" fill="#1d1d1d">GET 2: the same URL, a moment later</text>
<rect x="45" y="88" width="220" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="155.0" y="121.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GET /graphql</text>
<text x="155.0" y="138.0" font-size="11.5" fill="#555555" text-anchor="middle">?variables={code:USNYC}</text>
<text x="155.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">&amp;extensions={sha256Hash}</text>
<text x="155.0" y="168.0" font-size="11.5" fill="#555555" text-anchor="middle">Accept: application/json</text>
<rect x="315" y="88" width="220" height="100" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="425.0" y="121.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">nginx :8262</text>
<text x="425.0" y="138.0" font-size="11.5" fill="#555555" text-anchor="middle">no entry for this URL</text>
<text x="425.0" y="153.0" font-size="11.5" fill="#555555" text-anchor="middle">X-Cache-Status: MISS</text>
<text x="425.0" y="168.0" font-size="11.5" fill="#555555" text-anchor="middle">stores the answer</text>
<rect x="585" y="88" width="220" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="695.0" y="128.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Quarkus :8260</text>
<text x="695.0" y="145.5" font-size="11.5" fill="#555555" text-anchor="middle">Cache-Control:</text>
<text x="695.0" y="160.5" font-size="11.5" fill="#555555" text-anchor="middle">public, max-age=300</text>
<rect x="855" y="88" width="205" height="100" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="957.5" y="128.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">location owner</text>
<text x="957.5" y="145.5" font-size="11.5" fill="#555555" text-anchor="middle">location.getLocation:USNYC</text>
<text x="957.5" y="160.5" font-size="11.5" fill="#555555" text-anchor="middle">1 source call</text>
<rect x="45" y="278" width="220" height="100" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="155.0" y="311.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GET /graphql</text>
<text x="155.0" y="328.0" font-size="11.5" fill="#555555" text-anchor="middle">?variables={code:USNYC}</text>
<text x="155.0" y="343.0" font-size="11.5" fill="#555555" text-anchor="middle">&amp;extensions={sha256Hash}</text>
<text x="155.0" y="358.0" font-size="11.5" fill="#555555" text-anchor="middle">Accept: application/json</text>
<rect x="315" y="278" width="220" height="100" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="425.0" y="311.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">nginx :8262</text>
<text x="425.0" y="328.0" font-size="11.5" fill="#555555" text-anchor="middle">entry found, fresh</text>
<text x="425.0" y="343.0" font-size="11.5" fill="#555555" text-anchor="middle">X-Cache-Status: HIT</text>
<text x="425.0" y="358.0" font-size="11.5" fill="#555555" text-anchor="middle">answers from the cache</text>
<rect x="585" y="278" width="220" height="100" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="695.0" y="326.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Quarkus :8260</text>
<text x="695.0" y="343.0" font-size="11.5" fill="#555555" text-anchor="middle">not reached</text>
<rect x="855" y="278" width="205" height="100" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="957.5" y="326.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">location owner</text>
<text x="957.5" y="343.0" font-size="11.5" fill="#555555" text-anchor="middle">0 source calls</text>
<path d="M265,138 L315,138" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M535,138 L585,138" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M805,138 L855,138" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M265,328 L315,328" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="550" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">A persisted GET of reference data: stored by the first request, answered by the second</text>
<text x="550" y="436" font-size="12" fill="#555555" text-anchor="middle">The body of both responses is {&quot;data&quot;:{&quot;location&quot;:{&quot;name&quot;:&quot;New York&quot;}}}. Quarkus and Python differ only in header case.</text>
</svg>