<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="50" width="470" height="370" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#1d1d1d">SmallRye: one loader per field, keyed by the Leg</text>
<rect x="510" y="50" width="470" height="370" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="522" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Strawberry: one loader per kind of key, shared</text>
<rect x="45" y="95" width="190" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="140.0" y="121.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Leg.loadLocation</text>
<text x="140.0" y="138.0" font-size="11.5" fill="#555555" text-anchor="middle">loader keyed by Leg</text>
<rect x="265" y="95" width="200" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="365.0" y="121.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Leg.unloadLocation</text>
<text x="365.0" y="138.0" font-size="11.5" fill="#555555" text-anchor="middle">loader keyed by Leg</text>
<rect x="45" y="215" width="190" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="140.0" y="248.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">getLocations</text>
<text x="140.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">DEHAM+SGSIN+USNYC</text>
<rect x="265" y="215" width="200" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="365.0" y="248.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">getLocations</text>
<text x="365.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">CNSHA+DEHAM+NLRTM</text>
<rect x="45" y="335" width="420" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="255.0" y="361.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">DEHAM travels in both calls</text>
<text x="255.0" y="378.0" font-size="11.5" fill="#555555" text-anchor="middle">2 calls for the query</text>
<rect x="535" y="95" width="190" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="630.0" y="121.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Leg.loadLocation</text>
<text x="630.0" y="138.0" font-size="11.5" fill="#555555" text-anchor="middle">loads by UN/LOCODE</text>
<rect x="755" y="95" width="200" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="855.0" y="121.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Leg.unloadLocation</text>
<text x="855.0" y="138.0" font-size="11.5" fill="#555555" text-anchor="middle">loads by UN/LOCODE</text>
<rect x="535" y="215" width="420" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="745.0" y="248.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">one location loader, keyed by code</text>
<text x="745.0" y="265.0" font-size="11.5" fill="#555555" text-anchor="middle">getLocations CNSHA+DEHAM+NLRTM+SGSIN+USNYC</text>
<rect x="535" y="335" width="420" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="745.0" y="361.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">DEHAM is one key, loaded once</text>
<text x="745.0" y="378.0" font-size="11.5" fill="#555555" text-anchor="middle">1 call for the query</text>
<path d="M140,151 L140,215" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M365,151 L365,215" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M140,285 L140,335" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M630,151 L680,215" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M855,151 L810,215" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M745,285 L745,335" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">The same query, two batching units: 2 location calls on Quarkus, 1 on Python</text>
<text x="500" y="444" font-size="12" fill="#555555" text-anchor="middle">Either count is independent of page size. The difference is only whether two fields that want the same thing share a loader.</text>
</svg>