<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="60" y="70" width="330" height="60" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="225.0" y="98.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Is the request a GET?</text>
<text x="225.0" y="115.0" font-size="11.5" fill="#555555" text-anchor="middle">a POST body is not part of any cache key</text>
<rect x="60" y="170" width="330" height="60" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="225.0" y="198.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Did execution finish without errors?</text>
<text x="225.0" y="215.0" font-size="11.5" fill="#555555" text-anchor="middle">an error describes one request</text>
<rect x="60" y="270" width="330" height="60" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="225.0" y="298.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Are all root fields reference data?</text>
<text x="225.0" y="315.0" font-size="11.5" fill="#555555" text-anchor="middle">location, voyage, __typename</text>
<rect x="60" y="370" width="330" height="60" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="225.0" y="398.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Is there no Authorization header?</text>
<text x="225.0" y="415.0" font-size="11.5" fill="#555555" text-anchor="middle">what a caller may read can depend on who asks</text>
<rect x="60" y="480" width="330" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="225.0" y="513.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Cache-Control:</text>
<text x="225.0" y="530.0" font-size="11.5" fill="#555555" text-anchor="middle">public, max-age=300</text>
<rect x="640" y="250" width="330" height="90" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="805.0" y="285.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Cache-Control: no-store</text>
<text x="805.0" y="302.5" font-size="11.5" fill="#555555" text-anchor="middle">a no at any step keeps the</text>
<text x="805.0" y="317.5" font-size="11.5" fill="#555555" text-anchor="middle">response out of every shared cache</text>
<path d="M225,130 L225,170" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="243.0" y="150.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">yes</text>
<text x="243.0" y="150.0" font-size="11" fill="#555" text-anchor="middle">yes</text>
<path d="M225,230 L225,270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="243.0" y="250.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">yes</text>
<text x="243.0" y="250.0" font-size="11" fill="#555" text-anchor="middle">yes</text>
<path d="M225,330 L225,370" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="243.0" y="350.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">yes</text>
<text x="243.0" y="350.0" font-size="11" fill="#555" text-anchor="middle">yes</text>
<path d="M225,430 L225,480" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="243.0" y="455.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">yes</text>
<text x="243.0" y="455.0" font-size="11" fill="#b8650a" text-anchor="middle">yes</text>
<path d="M390,100 L640,270" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="445.0" y="145.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">no</text>
<text x="445.0" y="145.0" font-size="11" fill="#555" text-anchor="middle">no</text>
<path d="M390,200 L640,285" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="475.0" y="222.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">no</text>
<text x="475.0" y="222.5" font-size="11" fill="#555" text-anchor="middle">no</text>
<path d="M390,300 L640,300" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="515.0" y="290.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">no</text>
<text x="515.0" y="290.0" font-size="11" fill="#555" text-anchor="middle">no</text>
<path d="M390,400 L640,325" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="485.0" y="384.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">no</text>
<text x="485.0" y="384.5" font-size="11" fill="#555" text-anchor="middle">no</text>
<text x="500" y="32" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Deciding Cache-Control for one response</text>
<text x="640" y="380" font-size="12" fill="#555555" text-anchor="start">A PersistedQueryNotFound refusal is no-store too:</text>
<text x="640" y="400" font-size="12" fill="#555555" text-anchor="start">the document may be registered a moment later.</text>
</svg>