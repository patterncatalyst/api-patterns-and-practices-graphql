<text x="550" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Masking is an allowlist: only the errors a service chose to show reach the client</text>
<text x="550" y="490" font-size="12" fill="#555555" text-anchor="middle">Quarkus sends extensions.code null for a masked error (DeclaredErrorCodeProvider); Strawberry sends no extensions.</text>
