<text x="500.0" y="366.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">B_ARRAY: 55 bytes</text>
<text x="500.0" y="383.0" font-size="11.5" fill="#555555" text-anchor="middle">two operations in one body</text>
<rect x="357" y="409" width="286" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="500.0" y="427.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Work</text>
