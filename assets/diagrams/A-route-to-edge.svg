<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">TLS ends at the router; everything behind it speaks plain HTTP inside the project</text>
<text x="500" y="545" font-size="12" fill="#555555" text-anchor="middle">Hosts are &lt;name&gt;-gql-appendix-a.apps-crc.testing. Values from the rendered Routes and Services; no cluster output is shown.</text>
