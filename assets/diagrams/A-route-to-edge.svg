<text x="590.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">X-Forwarded headers</text>
<rect x="740" y="365" width="220" height="65" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="850.0" y="395.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">keycloak 26.8.1</text>
<text x="850.0" y="412.5" font-size="11.5" fill="#555555" text-anchor="middle">issuer = the Route&#x27;s URL</text>
<rect x="490" y="450" width="200" height="55" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="590.0" y="483.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Route grafana (edge TLS)</text>
