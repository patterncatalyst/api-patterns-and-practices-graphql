<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 512" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="20" width="1160" height="130" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="40" font-size="12" font-weight="700" fill="#1d1d1d">The change</text>
<rect x="20" y="170" width="1160" height="140" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="190" font-size="12" font-weight="700" fill="#1d1d1d">What the gate prints</text>
<rect x="20" y="330" width="1160" height="140" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="350" font-size="12" font-weight="700" fill="#1d1d1d">What clients see</text>
<rect x="30" y="56" width="260" height="80" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="160.0" y="86.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">1. Add the replacement</text>
<text x="160.0" y="103.5" font-size="11.5" fill="#555555" text-anchor="middle">finalArrivalTime: DateTime!</text>
<text x="160.0" y="118.5" font-size="11.5" fill="#555555" text-anchor="middle">served beside the old field</text>
<rect x="330" y="56" width="260" height="80" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="460.0" y="86.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">2. Deprecate with a reason</text>
<text x="460.0" y="103.5" font-size="11.5" fill="#555555" text-anchor="middle">@deprecated(reason:</text>
<text x="460.0" y="118.5" font-size="11.5" fill="#555555" text-anchor="middle">&quot;Use `finalArrivalTime`.&quot;)</text>
<rect x="630" y="56" width="260" height="80" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="760.0" y="86.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">3. Observe usage</text>
<text x="760.0" y="103.5" font-size="11.5" fill="#555555" text-anchor="middle">operation telemetry</text>
<text x="760.0" y="118.5" font-size="11.5" fill="#555555" text-anchor="middle">until no caller selects the old field</text>
<rect x="930" y="56" width="260" height="80" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="1060.0" y="86.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">4. Remove with a sign-off</text>
<text x="1060.0" y="103.5" font-size="11.5" fill="#555555" text-anchor="middle">finalArrivalDate deleted</text>
<text x="1060.0" y="118.5" font-size="11.5" fill="#555555" text-anchor="middle">from the schema</text>
<rect x="30" y="206" width="260" height="90" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="160.0" y="241.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">✔  Field finalArrivalTime was</text>
<text x="160.0" y="258.5" font-size="11.5" fill="#555555" text-anchor="middle">added to object type Itinerary</text>
<text x="160.0" y="273.5" font-size="11.5" fill="#555555" text-anchor="middle">exit 0</text>
<rect x="330" y="206" width="260" height="90" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="460.0" y="241.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">✔  Field Itinerary.finalArrivalDate</text>
<text x="460.0" y="258.5" font-size="11.5" fill="#555555" text-anchor="middle">is deprecated</text>
<text x="460.0" y="273.5" font-size="11.5" fill="#555555" text-anchor="middle">exit 0</text>
<rect x="630" y="206" width="260" height="90" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="760.0" y="249.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">no schema change</text>
<text x="760.0" y="266.0" font-size="11.5" fill="#555555" text-anchor="middle">nothing for the gate to print</text>
<rect x="930" y="206" width="260" height="90" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="1060.0" y="241.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">✖  Field finalArrivalDate (deprecated)</text>
<text x="1060.0" y="258.5" font-size="11.5" fill="#555555" text-anchor="middle">was removed from object type Itinerary</text>
<text x="1060.0" y="273.5" font-size="11.5" fill="#555555" text-anchor="middle">exit 1; with the sign-off rule: ⚠, exit 0</text>
<rect x="30" y="366" width="260" height="90" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="160.0" y="401.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Existing clients</text>
<text x="160.0" y="418.5" font-size="11.5" fill="#555555" text-anchor="middle">are unchanged</text>
<text x="160.0" y="433.5" font-size="11.5" fill="#555555" text-anchor="middle">new clients can adopt the new name</text>
<rect x="330" y="366" width="260" height="90" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="460.0" y="401.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Both fields execute</text>
<text x="460.0" y="418.5" font-size="11.5" fill="#555555" text-anchor="middle">and return the same instant;</text>
<text x="460.0" y="433.5" font-size="11.5" fill="#555555" text-anchor="middle">fields hides the old one by default</text>
<rect x="630" y="366" width="260" height="90" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="760.0" y="401.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Clients migrate</text>
<text x="760.0" y="418.5" font-size="11.5" fill="#555555" text-anchor="middle">on their own schedule</text>
<text x="760.0" y="433.5" font-size="11.5" fill="#555555" text-anchor="middle">(telemetry: Chapter 19)</text>
<rect x="930" y="366" width="260" height="90" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="1060.0" y="401.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">A client that still selects</text>
<text x="1060.0" y="418.5" font-size="11.5" fill="#555555" text-anchor="middle">the old field fails validation</text>
<text x="1060.0" y="433.5" font-size="11.5" fill="#555555" text-anchor="middle">so removal is a decision</text>
<path d="M290,96 L330,96" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M590,96 L630,96" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M890,96 L930,96" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="20" y="494" font-size="12" fill="#555555" text-anchor="start">Steps 1 and 2 shipped as one change in this chapter&#x27;s example. The gate reports them together.</text>
</svg>