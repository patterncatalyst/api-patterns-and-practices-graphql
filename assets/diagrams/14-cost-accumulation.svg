<text x="766" y="96" font-size="12" fill="#1d1d1d" text-anchor="start">trackingId = 1</text>
<text x="766" y="123" font-size="12" fill="#1d1d1d" text-anchor="start">voyage { number } = 1 + 1 = 2</text>
<text x="766" y="150" font-size="12" fill="#1d1d1d" text-anchor="start">load/unloadLocation = 2 each</text>
<text x="766" y="177" font-size="12" fill="#1d1d1d" text-anchor="start">legs = 1 + (2 + 2 + 2) = 7</text>
<text x="766" y="204" font-size="12" fill="#1d1d1d" text-anchor="start">itinerary = 1 + 7 = 8</text>
<text x="766" y="231" font-size="12" fill="#1d1d1d" text-anchor="start">delivery { transportStatus } = 2</text>
<text x="766" y="258" font-size="12" fill="#1d1d1d" text-anchor="start">node = 1 + (1 + 8 + 2) = 12</text>
<text x="766" y="285" font-size="12" fill="#1d1d1d" text-anchor="start">edges = 1 + 12 = 13</text>
<text x="766" y="312" font-size="12" fill="#1d1d1d" text-anchor="start">cargos(first: 4) = 1 + 4 x 13 = 53</text>
<text x="766" y="339" font-size="12" fill="#555555" text-anchor="start">legs has no page size: m = 1</text>
<text x="30" y="419" font-size="12" fill="#1d1d1d" text-anchor="start">Q_FAN</text>
