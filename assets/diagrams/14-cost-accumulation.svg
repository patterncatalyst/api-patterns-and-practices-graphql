<text x="30" y="491" font-size="12" fill="#1d1d1d" text-anchor="start">Q_WIDE_COST</text>
<text x="30" y="527" font-size="12" fill="#1d1d1d" text-anchor="start">Q_CH1</text>
<text x="583" y="554" font-size="12" fill="#b8650a" text-anchor="start">budget 1,000</text>
<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Cost accumulates from the leaves, and every page size multiplies everything beneath it</text>
