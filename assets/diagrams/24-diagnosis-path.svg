<text x="647.5" y="205.0" font-size="11.5" fill="#555555" text-anchor="middle">exception_message XXBAD</text>
<rect x="790" y="100" width="170" height="150" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="875.0" y="150.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">4  The data</text>
<text x="875.0" y="167.5" font-size="11.5" fill="#555555" text-anchor="middle">evt_10: UNLOAD</text>
<text x="875.0" y="182.5" font-size="11.5" fill="#555555" text-anchor="middle">at XXBAD</text>
