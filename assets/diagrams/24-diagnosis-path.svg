<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">The trace id in the error is the key to the trace, the log record and the data</text>
<text x="40" y="300" font-size="12" fill="#555555" text-anchor="start">The client sees only step 1.</text>
<text x="40" y="320" font-size="12" fill="#555555" text-anchor="start">Steps 2 to 4 are server-side and need access</text>
<text x="40" y="338" font-size="12" fill="#555555" text-anchor="start">to the observability backend.</text>
<text x="500" y="485" font-size="12" fill="#555555" text-anchor="middle">One run of DeliveryOfJkl on the Python stack. The Quarkus stack gives the same path with NoSuchElementException.</text>
