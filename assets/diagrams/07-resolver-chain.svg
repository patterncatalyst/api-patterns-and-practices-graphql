<text x="745" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">The resolver chain for cargo { itinerary { legs { voyage { number } } } }</text>
<text x="745" y="388" font-size="12" fill="#555555" text-anchor="middle">Each arrow into a resolver carries the parent value it receives. Each arrow to a source carries the key the resolver derived from it.</text>
