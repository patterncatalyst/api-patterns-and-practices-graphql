<text x="500.0" y="87.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">One image per stack</text>
<text x="500.0" y="104.0" font-size="11.5" fill="#555555" text-anchor="middle">the same code, configured by environment</text>
<rect x="45" y="215" width="420" height="150" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="255.0" y="273.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">introspection off: __schema, __type refused</text>
<text x="255.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">field suggestions off (Python)</text>
<text x="255.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">IDE off, GET queries off</text>
<text x="255.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">TLS, HSTS, CORS, JSON-only POST, body limit (Quarkus)</text>
<rect x="535" y="215" width="420" height="150" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="745.0" y="273.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">introspection on</text>
<text x="745.0" y="290.0" font-size="11.5" fill="#555555" text-anchor="middle">field suggestions on (Python)</text>
<text x="745.0" y="305.0" font-size="11.5" fill="#555555" text-anchor="middle">IDE on (Python), GET queries on (Python)</text>
<text x="745.0" y="320.0" font-size="11.5" fill="#555555" text-anchor="middle">TLS, HSTS, CORS, JSON-only POST, body limit (Quarkus)</text>
<rect x="45" y="455" width="200" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="145.0" y="483.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Browsers, partners</text>
<text x="145.0" y="500.0" font-size="11.5" fill="#555555" text-anchor="middle">the public internet</text>
<rect x="535" y="455" width="200" height="60" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="635.0" y="483.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">CI and developers</text>
<text x="635.0" y="500.0" font-size="11.5" fill="#555555" text-anchor="middle">assert_sdl_conforms</text>
<rect x="765" y="455" width="190" height="60" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="860.0" y="483.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">SDL export at build</text>
<text x="860.0" y="500.0" font-size="11.5" fill="#555555" text-anchor="middle">(Chapter 5), no endpoint</text>
<path d="M400,124 L255,215" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="287.5" y="163.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">deploy</text>
<text x="287.5" y="163.5" font-size="11" fill="#555" text-anchor="middle">deploy</text>
