<path d="M635,455 L635,365" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M765,485 L735,485" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">The same image deployed twice: introspection belongs on the instance only your own tools reach</text>
<text x="500" y="542" font-size="12" fill="#555555" text-anchor="middle">Anonymous callers reach only the public instance. The contract check needs a schema, not a public endpoint.</text>
