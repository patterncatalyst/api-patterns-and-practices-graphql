<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 620" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="50" width="520" height="520" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Quarkus: a route in front of SmallRye GraphQL</text>
<rect x="560" y="50" width="520" height="520" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="572" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Python: an extension inside Strawberry</text>
<rect x="60" y="90" width="440" height="62" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="280.0" y="119.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Vert.x route /graphql, order -10</text>
<text x="280.0" y="136.0" font-size="11.5" fill="#555555" text-anchor="middle">reads extensions.persistedQuery.sha256Hash</text>
<rect x="60" y="185" width="440" height="62" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="280.0" y="214.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">resolve the hash</text>
<text x="280.0" y="231.0" font-size="11.5" fill="#555555" text-anchor="middle">manifest first, then the quarkus-cache store</text>
<rect x="60" y="280" width="440" height="62" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="280.0" y="309.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">rc.reroute(..., /graphql?query=text&amp;variables=...)</text>
<text x="280.0" y="326.0" font-size="11.5" fill="#555555" text-anchor="middle">on GET the operation type is checked first</text>
<rect x="60" y="375" width="440" height="62" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="280.0" y="404.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">SmallRye route: query is now present</text>
<text x="280.0" y="421.0" font-size="11.5" fill="#555555" text-anchor="middle">the extensions were read before this route</text>
<rect x="60" y="470" width="440" height="62" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="280.0" y="499.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">parse and validate, document cached by text</text>
<text x="280.0" y="516.0" font-size="11.5" fill="#555555" text-anchor="middle">then execute</text>
<rect x="600" y="90" width="440" height="62" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="820.0" y="119.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">GraphQLRouter HTTP view</text>
<text x="820.0" y="136.0" font-size="11.5" fill="#555555" text-anchor="middle">accepts query: null and passes extensions on</text>
<rect x="600" y="185" width="440" height="62" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="820.0" y="214.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">PersistedQueries.on_operation</text>
<text x="820.0" y="231.0" font-size="11.5" fill="#555555" text-anchor="middle">sets execution_context.query from the hash</text>
<rect x="600" y="280" width="440" height="62" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="820.0" y="309.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Strawberry looks for the query</text>
<text x="820.0" y="326.0" font-size="11.5" fill="#555555" text-anchor="middle">it is set, so MissingQueryError is not raised</text>
<rect x="600" y="375" width="440" height="62" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="820.0" y="404.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">ParserCache and ValidationCache</text>
<text x="820.0" y="421.0" font-size="11.5" fill="#555555" text-anchor="middle">reuse the parse and validation of text seen before</text>
<rect x="600" y="470" width="440" height="62" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="820.0" y="499.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">execute</text>
<text x="820.0" y="516.0" font-size="11.5" fill="#555555" text-anchor="middle">the operation type is checked against GET here</text>
<path d="M280,152 L280,185" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M280,247 L280,280" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M280,342 L280,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M280,437 L280,470" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M820,152 L820,185" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M820,247 L820,280" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M820,342 L820,375" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M820,437 L820,470" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="550" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Where a persisted document is resolved: a route on Quarkus, an extension on Python</text>
<text x="550" y="594" font-size="12" fill="#555555" text-anchor="middle">The highlighted steps are the example&#x27;s implementation of Apollo&#x27;s protocol.</text>
</svg>