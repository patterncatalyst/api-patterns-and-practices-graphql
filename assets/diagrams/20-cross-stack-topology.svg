<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 495" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="50" width="960" height="380" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Two supergraphs over the same four subgraph contracts</text>
<rect x="330" y="80" width="340" height="55" rx="9" fill="#eef4fb" stroke="#2f6db5" stroke-width="2"/>
<text x="500.0" y="105.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">client</text>
<text x="500.0" y="122.5" font-size="11.5" fill="#555555" text-anchor="middle">one query, either gateway</text>
<rect x="130" y="190" width="240" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="250.0" y="223.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">gateway-a</text>
<text x="250.0" y="240.0" font-size="11.5" fill="#555555" text-anchor="middle">supergraph-a, host 8300</text>
<rect x="630" y="190" width="240" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="750.0" y="223.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">gateway-b</text>
<text x="750.0" y="240.0" font-size="11.5" fill="#555555" text-anchor="middle">supergraph-b, host 8301</text>
<rect x="40" y="340" width="200" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="140.0" y="373.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cargo on Quarkus</text>
<text x="140.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">SmallRye, host 8302</text>
<rect x="270" y="340" width="200" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="370.0" y="373.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">cargo on Python</text>
<text x="370.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">Strawberry, host 8303</text>
<rect x="530" y="340" width="200" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="630.0" y="373.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">handling on Quarkus</text>
<text x="630.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">SmallRye, host 8304</text>
<rect x="760" y="340" width="200" height="70" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="860.0" y="373.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">handling on Python</text>
<text x="860.0" y="390.0" font-size="11.5" fill="#555555" text-anchor="middle">Strawberry, host 8305</text>
<path d="M480,135 L300,190" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M520,135 L700,190" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M170,260 L140,340" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M330,260 L830,340" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M670,260 L380,340" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M830,260 L630,340" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">The subgraph contract is stack-neutral: either stack can own either subgraph</text>
<text x="40" y="455" font-size="12" fill="#555555" text-anchor="start">Each gateway reaches the cargo and the handling subgraph of its own pair. Composition runs once per pair.</text>
<text x="40" y="473" font-size="12" fill="#555555" text-anchor="start">White boxes are Quarkus with SmallRye GraphQL; amber boxes are Python with Strawberry.</text>
</svg>