<text x="500.0" y="260.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">values it exposes</text>
<text x="500.0" y="277.5" font-size="11.5" fill="#555555" text-anchor="middle">edge.tls.enabled, *.service.type</text>
<text x="500.0" y="292.5" font-size="11.5" fill="#555555" text-anchor="middle">image.repository and pullPolicy</text>
<text x="500.0" y="307.5" font-size="11.5" fill="#555555" text-anchor="middle">identity.issuer, keycloak.proxyHeaders</text>
<text x="500.0" y="322.5" font-size="11.5" fill="#555555" text-anchor="middle">lgtm.serviceAccountName, seccompProfile</text>
