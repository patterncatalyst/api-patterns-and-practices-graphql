<text x="835.0" y="213.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">final.* values</text>
<text x="835.0" y="230.0" font-size="11.5" fill="#555555" text-anchor="middle">ClusterIP, plain edge, IfNotPresent</text>
<rect x="710" y="265" width="250" height="70" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="835.0" y="298.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Routes x6, BuildConfigs x2,</text>
<text x="835.0" y="315.0" font-size="11.5" fill="#555555" text-anchor="middle">ImageStreams x2, anyuid RoleBinding</text>
<rect x="40" y="385" width="920" height="90" rx="9" fill="#ffffff" stroke="#8a8d91" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="500.0" y="420.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Application code, Containerfiles and images: the same in every tier</text>
<text x="500.0" y="437.5" font-size="11.5" fill="#555555" text-anchor="middle">quarkus/ and python/ of Chapter 27 build with their Containerfile unchanged;</text>
<text x="500.0" y="452.5" font-size="11.5" fill="#555555" text-anchor="middle">the cluster only changes who builds them, who terminates TLS and which SCC admits a pod</text>
