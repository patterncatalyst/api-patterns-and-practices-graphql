<text x="165.0" y="315.0" font-size="11.5" fill="#555555" text-anchor="middle">chart-generated certificate</text>
<rect x="365" y="95" width="270" height="110" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="500.0" y="133.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">gql-ch27-final 1.0.0</text>
<text x="500.0" y="150.0" font-size="11.5" fill="#555555" text-anchor="middle">edge, quarkus, python, keycloak,</text>
<text x="500.0" y="165.0" font-size="11.5" fill="#555555" text-anchor="middle">lgtm, NetworkPolicy, helm test</text>
<text x="500.0" y="180.0" font-size="11.5" fill="#555555" text-anchor="middle">no OpenShift kind, no UID</text>
