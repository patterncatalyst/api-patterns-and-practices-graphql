<text x="672.5" y="237.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">override</text>
<text x="672.5" y="237.5" font-size="11" fill="#b8650a" text-anchor="middle">override</text>
<path d="M500,335 L500,385" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">The wrapper adds Routes, builds and one SCC binding; the chart it depends on does not change</text>
<text x="500" y="500" font-size="12" fill="#555555" text-anchor="middle">Only examples/99-appendix-a-openshift-crc renders route.openshift.io, build.openshift.io and image.openshift.io objects.</text>
