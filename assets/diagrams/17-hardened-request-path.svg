<text x="510.0" y="34" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">A request to a public instance passes seven gates; each refusal happens before the next gate runs</text>
<text x="510.0" y="430" font-size="12" fill="#555555" text-anchor="middle">Responses observed with curl against both public instances. A refused form POST makes zero source calls, so no write happens.</text>
