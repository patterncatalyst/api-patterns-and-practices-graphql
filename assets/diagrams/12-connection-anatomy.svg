<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">A connection is a page of edges, a cursor on each edge, and the page&#x27;s own metadata</text>
<text x="500" y="404" font-size="12" fill="#555555" text-anchor="middle">Null at startCursor and endCursor means the page is empty. totalCount is nullable because counting can be too costly to promise.</text>
