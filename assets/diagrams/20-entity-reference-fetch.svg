<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">A reference costs the cargo subgraph one bulk call, not one call per event</text>
<text x="40" y="370" font-size="12" fill="#555555" text-anchor="start">The same shape on both stacks: SmallRye hands the resolver the list of keys (federation.batch-resolving-enabled);</text>
<text x="40" y="388" font-size="12" fill="#555555" text-anchor="start">Strawberry calls resolve_reference once per representation and a request-scoped DataLoader batches them.</text>
