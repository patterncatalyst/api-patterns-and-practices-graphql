<text x="145.0" y="123.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">handling subgraph</text>
<text x="145.0" y="140.0" font-size="11.5" fill="#555555" text-anchor="middle">HandlingEvent.location</text>
<text x="145.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">returns Location { unLocode }</text>
