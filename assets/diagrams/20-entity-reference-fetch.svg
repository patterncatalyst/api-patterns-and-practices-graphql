<text x="695.0" y="283.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">location.getLocations</text>
<text x="695.0" y="300.0" font-size="11.5" fill="#555555" text-anchor="middle">DEHAM+NLRTM+USNYC</text>
