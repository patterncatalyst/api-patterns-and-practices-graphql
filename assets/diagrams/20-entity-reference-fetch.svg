<text x="425.0" y="147.5" font-size="11.5" fill="#555555" text-anchor="middle">{__typename: &quot;Location&quot;,</text>
<text x="425.0" y="162.5" font-size="11.5" fill="#555555" text-anchor="middle"> unLocode: &quot;DEHAM&quot;}, ...</text>
