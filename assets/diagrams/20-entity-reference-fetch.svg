<text x="695.0" y="155.0" font-size="11.5" fill="#555555" text-anchor="middle">resolve_reference + DataLoader</text>
<text x="695.0" y="170.0" font-size="11.5" fill="#555555" text-anchor="middle">one call for every key</text>
