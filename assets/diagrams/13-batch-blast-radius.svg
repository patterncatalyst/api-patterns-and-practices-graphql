<text x="745.0" y="393.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">2 errors, one per path</text>
<text x="745.0" y="410.0" font-size="11.5" fill="#555555" text-anchor="middle">code SERVICE_UNAVAILABLE at edges 0 and 1</text>
<path d="M255,151 L255,185" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M150,241 L145,275" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M360,241 L365,275" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
