<text x="255.0" y="410.0" font-size="11.5" fill="#555555" text-anchor="middle">code SERVICE_UNAVAILABLE</text>
<rect x="535" y="95" width="420" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="745.0" y="121.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">booking.getCargos ABC123+GHI345</text>
<text x="745.0" y="138.0" font-size="11.5" fill="#555555" text-anchor="middle">GHI345 fails</text>
<rect x="535" y="185" width="420" height="56" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="745.0" y="211.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">the batch method fails its whole Uni</text>
<text x="745.0" y="228.0" font-size="11.5" fill="#555555" text-anchor="middle">every parent in the batch gets the failure</text>
<rect x="535" y="275" width="200" height="56" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
