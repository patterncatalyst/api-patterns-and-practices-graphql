<text x="855.0" y="301.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">edges[1].node</text>
<text x="855.0" y="318.0" font-size="11.5" fill="#555555" text-anchor="middle">null</text>
