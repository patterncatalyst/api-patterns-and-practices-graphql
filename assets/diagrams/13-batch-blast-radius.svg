<path d="M745,151 L745,185" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M640,241 L635,275" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M850,241 L855,275" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M745,331 L745,365" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">A failing key inside a batch: one null edge on Strawberry, the whole batch on SmallRye</text>
<text x="500" y="474" font-size="12" fill="#555555" text-anchor="middle">Both responses carry the same code and message. They differ in how many nodes the one failure takes with it.</text>
</svg>