<rect x="265" y="275" width="200" height="56" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="365.0" y="301.0" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">edges[1].node</text>
<text x="365.0" y="318.0" font-size="11.5" fill="#555555" text-anchor="middle">null</text>
<rect x="45" y="365" width="420" height="60" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
