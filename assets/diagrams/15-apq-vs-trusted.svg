<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" font-family="'Red Hat Text', system-ui, sans-serif" role="img">
<defs><marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker><marker id="am" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#e8870c"/></marker></defs>
<rect x="20" y="50" width="520" height="420" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="32" y="70" font-size="12" font-weight="700" fill="#1d1d1d">APQ: clients register documents at run time</text>
<rect x="560" y="50" width="520" height="420" rx="12" fill="#fafafa" stroke="#ddd"/>
<text x="572" y="70" font-size="12" font-weight="700" fill="#1d1d1d">Trusted documents: the build registers them</text>
<rect x="45" y="90" width="470" height="84" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="280.0" y="122.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Who registers</text>
<text x="280.0" y="139.5" font-size="11.5" fill="#555555" text-anchor="middle">Any client, with the hash and the text</text>
<text x="280.0" y="154.5" font-size="11.5" fill="#555555" text-anchor="middle">the first request pays the extra bytes</text>
<rect x="585" y="90" width="470" height="84" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="820.0" y="122.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">Who registers</text>
<text x="820.0" y="139.5" font-size="11.5" fill="#555555" text-anchor="middle">The build pipeline, from the client&#x27;s manifest</text>
<text x="820.0" y="154.5" font-size="11.5" fill="#555555" text-anchor="middle">the server loads it at start</text>
<rect x="45" y="190" width="470" height="84" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="280.0" y="222.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">What the server accepts</text>
<text x="280.0" y="239.5" font-size="11.5" fill="#555555" text-anchor="middle">Any text that matches its own hash</text>
<text x="280.0" y="254.5" font-size="11.5" fill="#555555" text-anchor="middle">a hash alone must have been registered</text>
<rect x="585" y="190" width="470" height="84" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="820.0" y="222.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">What the server accepts</text>
<text x="820.0" y="239.5" font-size="11.5" fill="#555555" text-anchor="middle">Manifest documents, by hash or by exact text</text>
<text x="820.0" y="254.5" font-size="11.5" fill="#555555" text-anchor="middle">unknown text: PERSISTED_QUERY_REQUIRED</text>
<rect x="45" y="290" width="470" height="84" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="280.0" y="322.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">What an attacker can do</text>
<text x="280.0" y="339.5" font-size="11.5" fill="#555555" text-anchor="middle">Register any text, fill the bounded store</text>
<text x="280.0" y="354.5" font-size="11.5" fill="#555555" text-anchor="middle">evict the entries real clients rely on</text>
<rect x="585" y="290" width="470" height="84" rx="9" fill="#fff3e0" stroke="#e8870c" stroke-width="2"/>
<text x="820.0" y="322.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">What an attacker can do</text>
<text x="820.0" y="339.5" font-size="11.5" fill="#555555" text-anchor="middle">Nothing new runs and nothing is stored</text>
<text x="820.0" y="354.5" font-size="11.5" fill="#555555" text-anchor="middle">introspection text is refused too</text>
<rect x="45" y="390" width="470" height="84" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="280.0" y="422.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">What a cache or gateway sees</text>
<text x="280.0" y="439.5" font-size="11.5" fill="#555555" text-anchor="middle">Short GET URLs once registered</text>
<text x="280.0" y="454.5" font-size="11.5" fill="#555555" text-anchor="middle">a miss costs one more round trip</text>
<rect x="585" y="390" width="470" height="84" rx="9" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
<text x="820.0" y="422.5" font-size="13.5" font-weight="700" fill="#1a1a1a" text-anchor="middle">What a cache or gateway sees</text>
<text x="820.0" y="439.5" font-size="11.5" fill="#555555" text-anchor="middle">Short GET URLs, no registration miss</text>
<text x="820.0" y="454.5" font-size="11.5" fill="#555555" text-anchor="middle">the manifest must ship before the client</text>
<text x="550" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Two uses of the same hash: a bandwidth tool and an allowlist</text>
<text x="550" y="494" font-size="12" fill="#555555" text-anchor="middle">APQ is not a security control. Trusted mode is one, and Chapter 14&#x27;s limits remain the backstop.</text>
</svg>