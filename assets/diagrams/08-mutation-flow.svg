<text x="600" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">registerHandlingEvent: from the input object to the payload</text>
<text x="600" y="392" font-size="12" fill="#555555" text-anchor="middle">Coercion belongs to the engine and runs before the resolver. Validation, lookup, append and re-read run in the resolver.</text>
<text x="600" y="412" font-size="12" fill="#555555" text-anchor="middle">A request with a new key, or no key, takes the full path to appendEvent. A key hit skips the append and goes straight to the re-read.</text>
