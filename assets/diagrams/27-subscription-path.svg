<text x="216.0" y="174.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">upgrade</text>
<text x="216.0" y="174.5" font-size="11" fill="#555" text-anchor="middle">upgrade</text>
<path d="M200,225 L260,260" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M200,325 L260,300" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M200,430 L300,360" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="230.0" y="401.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">mutation</text>
<text x="230.0" y="401.0" font-size="11" fill="#b8650a" text-anchor="middle">mutation</text>
<path d="M400,360 L490,435" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="485.0" y="393.5" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">proxied</text>
<text x="485.0" y="393.5" font-size="11" fill="#b8650a" text-anchor="middle">proxied</text>
<path d="M430,215 L490,125" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M430,235 L490,225" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M430,325 L490,325" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M590,410 L590,360" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<text x="624.0" y="385.0" font-size="11" fill="#ffffff" stroke="#ffffff" stroke-width="3" paint-order="stroke" text-anchor="middle">broadcast</text>
<text x="624.0" y="385.0" font-size="11" fill="#b8650a" text-anchor="middle">broadcast</text>
<path d="M690,125 L750,125" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<path d="M690,410 L800,280" fill="none" stroke="#b8650a" stroke-width="2" marker-end="url(#am)"/>
<path d="M850,170 L850,200" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M850,280 L850,310" fill="none" stroke="#555" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)"/>
<path d="M690,445 L750,445" fill="none" stroke="#555" stroke-width="2" marker-end="url(#a)"/>
<text x="500" y="28" font-size="11" fill="#1d1d1d" text-anchor="middle" font-weight="700">Admission happens once; authorization of fields happens on every event, as the subscriber</text>
<text x="500" y="542" font-size="12" fill="#555555" text-anchor="middle">Values from verify.sh: evt_10 is the first write of the run on each public instance.</text>
</svg>